<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=onluyenthiquoctich.html">
    <meta name="description" content="Tài liệu ôn luyện thi quốc tịch Úc - Australian Citizenship Test">
    <meta name="keywords" content="quốc tịch úc, australian citizenship, test, ôn luyện">
    <title>Tài liệu Ôn-Luyện Thi Quốc Tịch Úc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }
        
        .manual-link {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .manual-link a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 25px;
            border: 2px solid white;
            border-radius: 25px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .manual-link a:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .logo {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🇦🇺</div>
        <h1>Tài Liệu Ôn-Luyện Thi Quốc Tịch Úc</h1>
        <p>Đang chuyển hướng...</p>
        <div class="spinner"></div>
        
        <div class="manual-link">
            <p style="font-size: 0.9rem; margin-bottom: 10px;">Nếu không tự động chuyển trang</p>
            <a href="onluyenthiquoctich.html">👉 Nhấn vào đây</a>
        </div>
    </div>
    
    <script>
        // Fallback redirect nếu meta refresh không hoạt động
        setTimeout(function() {
            window.location.href = 'onluyenthiquoctich.html';
        }, 100);
    </script>
</body>
</html>
