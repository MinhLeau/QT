    <!-- Firebase Authentication - CHỈ IMPORT MỘT LẦN -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDvB54m2uxhjuE2moJQ09NcuAEVhro7Zh4",
            authDomain: "quoctichuc-43f28.firebaseapp.com",
            projectId: "quoctichuc-43f28",
            storageBucket: "quoctichuc-43f28.firebasestorage.app",
            messagingSenderId: "710420527110",
            appId: "1:710420527110:web:ba4281739f963e76656b87"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Kiểm tra đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Chưa đăng nhập, chuyển về trang login
                window.location.href = 'login.html';
            } else {
                // Đã đăng nhập, hiển thị thông tin user
                console.log('Logged in as:', user.email);
            }
        });

        // Hàm đăng xuất (gọi khi user click nút logout)
        window.logout = async function() {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Lỗi đăng xuất: ' + error.message);
            }
        };
    </script>

    <script>
let lastScrollTop = 0;

const hideTargets = [
    document.querySelector('.logout-btn'),
    document.querySelector('.home-btn'),
    document.querySelector('.home-btnTS')
];

window.addEventListener('scroll', () => {
    const st = window.pageYOffset || document.documentElement.scrollTop;
    const isScrollingDown = st > lastScrollTop;

    hideTargets.forEach(el => {
        if (!el) return;
        el.classList.toggle('hide-on-scroll', isScrollingDown);
    });

    lastScrollTop = st <= 0 ? 0 : st;
});
</script>
