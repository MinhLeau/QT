<head>

    <title>Australian Citizenship - Our Common Bond</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000 url('home.png') center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 70, 90, 0.65);
            z-index: 1;
        }

        /* Dòng "Created by Thomas" - bên phải trên cùng */
        .credit {
            position: absolute;
            top: 59px;
            right: 20px;
            z-index: 10;
            font-size: 0.6rem;
            color: #bfff00;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.8);
            font-weight: normal;
        }

		h3 {
            text-align: right;
            color: #006400;
            margin: 5px 0 5px 0;
            font-size: 0.8rem;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 90%;
            padding: 20px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #005a9e;
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 22px 50px;
            border-radius: 12px;
            text-decoration: none;
            min-width: 280px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            border: 3px solid #ffffff44;
        }

        .btn:hover {
            background: #003e72;
            transform: translateY(-10px);
            box-shadow: 0 18px 35px rgba(0,0,0,0.6);
        }

        .btn-subtitle {
            font-size: 0.8rem;
            font-weight: normal;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Dòng chữ mới "Tài liệu" */
        .subtitle {
            font-size: 2.9rem;
            font-weight: bold;
            color: #ffffff;
            margin: 30px 0 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            .credit { font-size: 0.8rem; top: 10px; right: 15px; }
            .subtitle { font-size: 2.2rem; margin: 20px 0 10px; }
            .btn {
                font-size: 1.4rem;
                padding: 18px 35px;
                min-width: 240px;
            }
            .btn-subtitle {
                font-size: 0.7rem;
            }
            .button-container { gap: 20px; }
        }

        /* === NÚT HOME & ABOUT === */
        .home-btn, .home-btnTS {
            position: absolute;
            top: 5px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: all 0.3s;
        }

        .home-btn {
            left: 15px;
            background: #006400;
        }
        .home-btn::before { content: "🏠"; }
        .home-btn:hover { background: #004d00; transform: scale(1.1); }

        .home-btnTS {
            right: 37px;
            background: url("TS.jpg") center / 100% no-repeat, #006400;
        }
        .home-btnTS:hover { transform: scale(1.1); }
        .home-btnTS::before { content: none; }
		
    </style>
</head>

    </div>
