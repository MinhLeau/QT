    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            padding: 20px;
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #006400;
            margin: -20px 0 0 10px;
        }
        h3 {
            text-align: right;
            color: #006400;
            margin: 0;
            font-size: 10px;
        }
        h2 {
            text-align: center;
            color: #e51803;
            margin: 30px 0 10px;
            font-size: 1.8rem;
        }

/* === NÚT HOME & ABOUT === */
.home-btn, .home-btnTS {
    position: absolute;
    top: 0px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 1000;
    transition: all 0.3s;
}

.home-btn {
    left: 13px;
    background: #006400;
}
.home-btn::before { content: "🏠"; }
.home-btn:hover { background: #004d00; transform: scale(1.1); }

.home-btnTS {
    right: 27px;
    background: url("TS.jpg") center / 100% no-repeat, #006400;
}
.home-btnTS:hover { transform: scale(1.1); }
.home-btnTS::before { content: none; }

        /* Thanh điều hướng nhỏ giống V4.html */
        .nav-bar {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .nav-bar .btn {
            background: #006400;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }
        .nav-bar .btn:hover {
            background: #004d00;
        }

        /* Container các nút Audio lớn */
        .audio-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 10px;
            padding: 20px;
        }

        /* Nút Audio - màu đỏ nổi bật */
        .audio-btn {
            display: block;
            background: #e51803;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 12px;
            text-decoration: none;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border: 3px solid #ffffff44;
        }
        .audio-btn:hover {
            background: #c41b00;
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        /* Responsive cho điện thoại */
        @media (max-width: 768px) {
            h2 { font-size: 1.5rem; }
            .audio-btn {
                font-size: 1.2rem;
                padding: 10px 20px;
                min-width: 150px;
            }
            .audio-container { gap: 20px; }
        }
		        /* Dòng "Created by Thomas" - bên phải trên cùng */
        .credit {
            position: absolute;
            top: 45px;
            right: 16px;
            z-index: 10;
            font-size: 0.6rem;
            color: #006400;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.8);
            font-weight: normal;
		}
		
    </style>
</head>
