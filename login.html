<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Tài liệu Quốc tịch Úc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .auth-header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .auth-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }
        .auth-body {
            padding: 40px 30px;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }
        .tab-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .forgot-password {
            text-align: right;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .forgot-password a {
            color: #667eea;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }
        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 0.9rem;
        }
        .google-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @media (max-width: 768px) {
            .auth-header h1 {
                font-size: 1.5rem;
            }
            .auth-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Tài liệu ôn luyện thi Quốc Tịch Úc</h1>
            
            <p style="font-size: 0.75rem; margin-top: 10px; opacity: 0.8;">⚠️ Chỉ sử dụng "Ghi nhớ" trên thiết bị cá nhân</p>
        </div>
        <div class="auth-body">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
                <button class="tab-btn" onclick="switchTab('register')">Đăng ký</button>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <!-- Form Đăng nhập -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                    <input type="checkbox" id="rememberMe" style="width: auto; transform: scale(1.2); cursor: pointer;">
                    <label for="rememberMe" style="margin: 0; cursor: pointer; font-weight: normal;">Ghi nhớ đăng nhập</label>
                </div>
                <div class="forgot-password">
                    <a href="#" onclick="resetPassword(); return false;">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="submit-btn">Đăng nhập</button>
            </form>
            
            <!-- Form Đăng ký -->
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="registerName">Họ tên</label>
                    <input type="text" id="registerName" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Mật khẩu</label>
                    <input type="password" id="registerPassword" placeholder="••••••••" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="registerPasswordConfirm">Xác nhận mật khẩu</label>
                    <input type="password" id="registerPasswordConfirm" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn">Đăng ký</button>
            </form>
            
            <div class="divider">
                <span>hoặc</span>
            </div>
            
            <button class="google-btn" onclick="signInWithGoogle()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Đăng nhập với Google
            </button>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged,
            sendPasswordResetEmail,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDvB54m2uxhjuE2moJQ09NcuAEVhro7Zh4",
            authDomain: "quoctichuc-43f28.firebaseapp.com",
            projectId: "quoctichuc-43f28",
            storageBucket: "quoctichuc-43f28.firebasestorage.app",
            messagingSenderId: "710420527110",
            appId: "1:710420527110:web:ba4281739f963e76656b87"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Tự động điền email và mật khẩu nếu đã lưu
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('savedEmail');
            const savedPassword = localStorage.getItem('savedPassword');
            
            if (savedEmail) {
                document.getElementById('loginEmail').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
            }
            
            if (savedPassword) {
                // Giải mã mật khẩu đơn giản (base64)
                try {
                    const decodedPassword = atob(savedPassword);
                    document.getElementById('loginPassword').value = decodedPassword;
                } catch (e) {
                    console.error('Error decoding password');
                }
            }
        });

        // ✅ QUAN TRỌNG: BẬT LẠI kiểm tra trạng thái đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'onluyenthiquoctich.html';
            }
        });

        // Xử lý đăng ký
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            if (password !== passwordConfirm) {
                showError('Mật khẩu xác nhận không khớp!');
                return;
            }
            if (password.length < 6) {
                showError('Mật khẩu phải có ít nhất 6 ký tự!');
                return;
            }
            
            try {
                await setPersistence(auth, browserLocalPersistence);
                await createUserWithEmailAndPassword(auth, email, password);
                showSuccess('Đăng ký thành công! Đang chuyển hướng...');
                setTimeout(() => {
                    window.location.href = 'onluyenthiquoctich.html';
                }, 1500);
            } catch (error) {
                handleAuthError(error);
            }
        });

        // Xử lý đăng nhập
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            try {
                // SET persistence theo lựa chọn người dùng
                await setPersistence(
                    auth,
                    rememberMe ? browserLocalPersistence : browserSessionPersistence
                );

                // Lưu email và mật khẩu nếu check "Ghi nhớ"
                if (rememberMe) {
                    localStorage.setItem('savedEmail', email);
                    // Mã hóa mật khẩu đơn giản bằng base64 (không an toàn tuyệt đối)
                    localStorage.setItem('savedPassword', btoa(password));
                } else {
                    localStorage.removeItem('savedEmail');
                    localStorage.removeItem('savedPassword');
                }

                await signInWithEmailAndPassword(auth, email, password);

                showSuccess('Đăng nhập thành công! Đang chuyển hướng...');
                setTimeout(() => {
                    window.location.href = 'onluyenthiquoctich.html';
                }, 1200);

            } catch (error) {
                handleAuthError(error);
            }
        });

        // Quên mật khẩu
        window.resetPassword = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showError('Vui lòng nhập email của bạn trước khi đặt lại mật khẩu!');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Đã gửi link đặt lại mật khẩu đến email của bạn. Vui lòng kiểm tra hộp thư (và thư rác/spam)!');
            } catch (error) {
                handleAuthError(error);
            }
        };

        // Đăng nhập với Google
        window.signInWithGoogle = async function() {
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, googleProvider);
                showSuccess('Đăng nhập thành công! Đang chuyển hướng...');
                setTimeout(() => {
                    window.location.href = 'onluyenthiquoctich.html';
                }, 1500);
            } catch (error) {
                handleAuthError(error);
            }
        };

        // Hiển thị lỗi
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 8000);
        }

        // Hiển thị thành công
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 8000);
        }

        // Xử lý lỗi Firebase
        function handleAuthError(error) {
            console.log('Firebase Error:', error.code, error.message);

            let message = 'Đã xảy ra lỗi. Vui lòng thử lại!';

            switch (error.code) {
                case 'auth/email-already-in-use':
                    message = 'Email này đã được đăng ký!';
                    break;
                case 'auth/invalid-email':
                    message = 'Email không hợp lệ!';
                    break;
                case 'auth/weak-password':
                    message = 'Mật khẩu quá yếu! (ít nhất 6 ký tự)';
                    break;
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    message = 'Email hoặc mật khẩu không đúng!';
                    break;
                case 'auth/too-many-requests':
                    message = 'Quá nhiều lần thử sai. Tài khoản tạm khóa, thử lại sau vài phút!';
                    break;
                case 'auth/network-request-failed':
                    message = 'Lỗi kết nối mạng. Kiểm tra internet và thử lại!';
                    break;
                default:
                    message = 'Lỗi: ' + error.message;
                    break;
            }

            showError(message);
        }

        // Chuyển tab
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            document.querySelectorAll('.auth-form').forEach(form => {
                form.classList.remove('active');
            });
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
            }

            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        };
    </script>
</body>
</html>
